[package]
name = "betteroffice-vsdx-survey"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Engine coverage survey for VSDX diagrams."
readme = "README.md"

[[bin]]
name = "betteroffice-vsdx-survey"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
